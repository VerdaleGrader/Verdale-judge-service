name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
  integration:
    runs-on: ubuntu-24.04 # cgroup v2; the test container is privileged
    steps:
      - uses: actions/checkout@v4
      - run: make test-integration
