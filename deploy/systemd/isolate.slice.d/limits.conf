# /etc/systemd/system/isolate.slice.d/limits.conf
#
# Every sandbox lives under isolate.slice. Each box has its own limits; these
# are the ceiling for all of them together, so that a bug in one of the
# per-box limits (or a flood of jobs) cannot take the whole machine.
# install.sh replaces the percentages below with figures for this machine.
[Slice]
MemoryAccounting=true
TasksAccounting=true
# Leave room for Judge, Redis and the OS.
MemoryMax=85%
MemorySwapMax=0
TasksMax=20000
